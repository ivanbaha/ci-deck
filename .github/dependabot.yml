version: 2

# CI Deck has no runtime dependencies, so nothing here watches the package. What
# it watches is the two things a release is made out of: the actions that check
# and publish it, and the image it is published as.
updates:
  # Both workflows pin every action to a commit, which is what keeps a repointed
  # tag from reaching any job — and pinned means nothing updates unless something
  # updates it. That is this. The group moves both files in one pull request, so
  # CI never checks a build with an action the release would not use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # The Dockerfile upgrades Alpine's packages at build time, so those patch
  # themselves. Bun does not: it is a binary baked into the base image, not an apk
  # package, so the only way off a stale one is to move the tag. Both stages name
  # the same image and land in one pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build'
