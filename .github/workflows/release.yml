name: Release

# You write the release; publishing it is what ships the package.
#
# Nothing goes to npm from pushing a tag, so a tag can sit there while you draft
# notes against it. Running this by hand is a rehearsal that stops at
# `npm publish --dry-run` and can never publish.
#
# Note: GitHub only runs `release` workflows from the file on the default branch,
# so changes here have to land on main before they take effect.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publishing: ${{ steps.version.outputs.publishing }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release can point at any commit, so build exactly what it names.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Work out the version and the dist-tag
        id: version
        run: |
          set -euo pipefail
          version="$(bun pm pkg get version | tr -d '"')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A version like 0.1.0-b1 is a pre-release.
          case "$version" in
            *-*) version_is_pre=true;  dist_tag=beta   ;;
            *)   version_is_pre=false; dist_tag=latest ;;
          esac
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "release" ]; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            echo "Rehearsal for ${version}; it would publish under \`${dist_tag}\`. Nothing will be."
            exit 0
          fi
          echo "publishing=true" >> "$GITHUB_OUTPUT"

          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::release ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

          # A version like 0.1.0-b1 is a pre-release. Publishing one as `latest`
          # would hand it to everyone running `bun add ci-deck`, so the two ways
          # of saying "pre-release" have to agree before anything ships.
          case "$version" in
            *-*) version_is_pre=true ;;
            *)   version_is_pre=false ;;
          esac
          marked_pre="${{ github.event.release.prerelease }}"

          if [ "$version_is_pre" != "$marked_pre" ]; then
            echo "::error::version ${version} says pre-release=${version_is_pre}, but the release is marked pre-release=${marked_pre}. Fix one of them."
            exit 1
          fi

          if [ "$version_is_pre" = "true" ]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "Publishing ${version} under the \`beta\` dist-tag."
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing ${version} under \`latest\`."
          fi

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/ci-deck/${version}")"
          echo "registry says ${status} for ci-deck@${version}"
          if [ "$status" = "200" ]; then
            echo "::error::ci-deck@${version} is already published — bump the version"
            exit 1
          fi

      - name: Build the browser bundle
        run: bun run build:web

      - name: Pack and check the tarball carries the bundle
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"

          # Listed to a file rather than piped: `grep -q` stops reading at the
          # first match, `tar` then dies on EPIPE, and `pipefail` reports that as
          # the pipeline's status — failing the check precisely when it passes.
          tar -tzf "$RUNNER_TEMP"/ci-deck-*.tgz > "$RUNNER_TEMP/contents.txt"

          if ! grep -qx 'package/public/assets/main.js' "$RUNNER_TEMP/contents.txt"; then
            echo "::error::public/assets/main.js is not in the tarball"
            cat "$RUNNER_TEMP/contents.txt"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ${{ runner.temp }}/ci-deck-*.tgz
          if-no-files-found: error

  # Cross-compiled from one runner: `bun build --compile` fetches the Bun runtime
  # for each target itself, so this needs no per-OS matrix. Rehearsals build them
  # too — a target that stops compiling should not first appear during a release.
  binaries:
    name: standalone binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both for the attestation below: it is signed with an OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Compile every target
        run: bun run compile all

      # These are downloaded with curl rather than installed by a package
      # manager, so nothing checks them on the way in unless we ship the means.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ci-deck-* > SHA256SUMS
          cat SHA256SUMS

      # What `npm publish --provenance` gives the package, for the executables:
      # a signed statement of which workflow built them, from which commit.
      # Rehearsals skip it — an attestation is a claim about something shipped.
      - name: Attest what built them
        if: needs.verify.outputs.publishing == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ci-deck-*

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/ci-deck-*
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Also what lets a token-based
      # publish attach a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # bun builds the bundle; the npm CLI publishes, because trusted publishing
      # and provenance are npm CLI features.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      - name: Build the browser bundle
        run: bun run build:web

      # Distinguishes "the job cannot mint an OIDC token" from "npm would not use
      # it". Without this, both surface as an npm auth error much further along.
      - name: Check an OIDC token can be minted
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job — it is missing 'id-token: write'."
            exit 1
          fi
          echo "OIDC token endpoint is present."

      - name: Publish (rehearsal)
        if: needs.verify.outputs.publishing != 'true'
        run: npm publish --dry-run --tag "${{ needs.verify.outputs.dist_tag }}"

      # No NPM_TOKEN anywhere: the package exists, so publishing goes through the
      # trusted publisher configured on npmjs.com for this repo and this workflow
      # file. `--provenance` is passed rather than relied on — it is a no-op when
      # npm would have attached one anyway.
      - name: Publish
        if: needs.verify.outputs.publishing == 'true'
        run: npm publish --provenance --tag "${{ needs.verify.outputs.dist_tag }}"

  # Behind `publish` for the same reason the downloads are: an image tagged with a
  # version that never reached npm is a version that does not exist.
  #
  # Both architectures are built on the one runner and nothing is emulated — see
  # the Dockerfile for why. A rehearsal builds them and pushes nothing.
  image:
    name: docker image
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # The runtime stage installs one package, so building the image for the
      # architecture this runner is not needs emulation. Everything else about the
      # build is arch-independent by design — see the Dockerfile.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Docker Hub is the only thing here that needs a stored credential, so the
      # release goes on without it rather than failing: no DOCKERHUB_TOKEN means
      # GHCR only. Secrets cannot be read in an `if:`, hence the indirection.
      - name: Is Docker Hub configured?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "configured=${TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - name: Work out the names and tags
        id: tags
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"

          # Both registries take lowercase names only.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          ghcr="ghcr.io/$(lower "$GITHUB_REPOSITORY")"
          hub="docker.io/$(lower "$HUB_USER")/ci-deck"

          names="$ghcr"
          if [ "${{ steps.hub.outputs.configured }}" = "true" ]; then
            names="$names $hub"
          fi

          # `latest` follows the npm dist-tag, so a pre-release never becomes it.
          tags=""
          for name in $names; do
            tags="${tags}${name}:${version},"
            if [ "${{ needs.verify.outputs.dist_tag }}" = "latest" ]; then
              tags="${tags}${name}:latest,"
            fi
          done

          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"
          echo "tags=${tags%,}" >> "$GITHUB_OUTPUT"
          echo "Tagging: ${tags%,}"

      - name: Sign in to GHCR
        if: needs.verify.outputs.publishing == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign in to Docker Hub
        if: needs.verify.outputs.publishing == 'true' && steps.hub.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build, pushed to both registries, so the two carry the same digest
      # rather than two images that merely came from the same commit.
      - name: Build, and push when this is a release
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publishing == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}

      # Attested per name, because the name is part of what is being claimed. Only
      # the GHCR copy carries its attestation in the registry: GitHub's own store
      # answers for both, and it is the one `gh attestation verify` reads.
      - name: Attest the GHCR image
        if: needs.verify.outputs.publishing == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.tags.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the Docker Hub image
        if: needs.verify.outputs.publishing == 'true' && steps.hub.outputs.configured == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.tags.outputs.hub }}
          subject-digest: ${{ steps.build.outputs.digest }}

  # Additive only: the notes stay exactly as you wrote them. Drop this job if you
  # would rather the release carry nothing you did not attach yourself.
  #
  # The binaries wait on `publish` as well, so a release never offers downloads
  # for a version that never reached npm.
  attach:
    name: attach downloads
    needs: [verify, publish, binaries]
    if: needs.verify.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Upload them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
